name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests (no hardware needed)
        run: python -m pytest -q
      - name: Validate scenarios
        # Errors fail the build. Warnings (e.g. placeholder UIDs of physical
        # tokens in the public config.json) are reported but do not fail it.
        run: python tools/validate_scenarios.py
      - name: Compile check
        run: python -m compileall -q app challenges tools zerorange.py database.py web_lcd_server.py
